<body>
    <div class="quiz-card">
        <h2> Em Jogos de RPG e FPS, o que significa o termo "DPS"?</h2>

        <input type="radio" name="rpg_quiz" id="wrong1">
        <label for="wrong1"> Defesa por Segundo</label>
        <br>

        <input type="radio" name="rpg_quiz" id="correct">
        <label for="correct"> Dano por Segundo</label>
        <br>

        <input type="radio" name="rpg_quiz" id="wrong2">
        <label for="wrong2"> Distância Por Salto</label>
        <br>

        <div class="feedback feedback-correct"> Acerto Crítico! Parabéns!!</div>
        <div class="feedback feedback-wrong"> Voçê errou!! Tente novamente.</div>

    </div>
