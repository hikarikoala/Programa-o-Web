<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 6 - Mostrar/Ocultar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header class="card-header">
            <h1 class="card-title">Segredo</h1>
            <p class="card-subtitle">Clique no botão para ver a mensagem!</p>
        </header>

        <p id="texto-secreto" class="text-center" style="display: none; font-weight:600;">
            Parabéns, você revelou o texto secreto!
        </p>

        <div class="btn-group">

            <button id="btn-toggle" class="btn">Mostrar Texto</button>

        </div>
    </main>
    <script src="script6.js"></script>
</body>
