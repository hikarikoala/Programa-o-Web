<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5 - Tabela do tipo de pokémon</title>
</head>
<body>
    <h1>Tabela de Estatísticas</h1>
    <br>
    <table border="1"; style=" background-color:bisque;"><!-- Tabela (Coluna e Linha )-->
        <thead>
            <tr>
                <th>Tipo Atacante</th>
                <th>Super Efetivo</th>
                <th>Pouco Efetivo</th>
                <th>Sem Efeito</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Fogo</td>
                <td>Grama, Gelo, Inseto, Aço</td>
                <td>Fogo, Água, Pedra, Dragão</td>
                <td> 0% </td>
                
            </tr>
            <tr>
                <td>Água</td>
                <td>Fogo, terra, pedra</td>
                <td>Água, Grama, velocidade</td>
                <td> 0% </td>
                
            </tr>
            <tr>
                <td>Elétrico</td>
                <td>Água, Voador</td>
                <td>Elétrico, Terra, Aço</td>
                <td> 0% </td>
                
            </tr>
        </tbody>

    </table>
</body>
</html>
