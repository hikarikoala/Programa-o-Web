<!DOCTYPE html>

<body>
    <div class="quiz-card">
       <!-- Questão 7 (Correta: 2) -->
        <h2>Questão 8: Qual tag HTML é usada para criar uma lista numerada (ordenada)?</h2>

<!-- Alternativa 1 (Errada) -->
        <input type="radio" name="q7" id="q7_wrong1">
        <label for="q7_wrong1">&lt;ul&gt;</label>

<!-- Alternativa 2 (Correta) -->
        <input type="radio" name="q7" id="q7_correct">
        <label for="q7_correct">&lt;ol&gt;</label>

<!-- Alternativa 3 (Errada) -->
        <input type="radio" name="q7" id="q7_wrong2">
        <label for="q7_wrong2">&lt;list&gt;</label>

        <br>
        <!-- feedbacks-->
        <div class="feedback feedback-correct"> Parabéns! Você acertou! </div>
        <div class="feedback feedback-wrong"> Tente Novamente!</div>

        <a href="index.html" class="btn-nav"> Próxima questão &rarr; </a>

    </div>


</body>
</html>
