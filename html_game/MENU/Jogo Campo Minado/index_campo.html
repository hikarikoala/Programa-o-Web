<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_campo.css">
    <title>Campo Minado</title>
</head>
<body>
    <div class="game-container">
        <h1>Campo Minado</h1>

        <!-- INPUTS PRIMEIRO (para o seletor ~ funcionar em tudo) -->
        <input type="checkbox" id="c1" class="safe">
        <input type="checkbox" id="c2" class="safe">
        <input type="checkbox" id="c3" class="safe">
        <input type="checkbox" id="c4" class="safe">
        <input type="checkbox" id="c5" class="safe">
        <input type="checkbox" id="c6" class="safe">
        <input type="checkbox" id="c7" class="safe">

        <input type="checkbox" id="b1" class="bomb">
        <input type="checkbox" id="b2" class="bomb">

        <!-- PLACAR -->
        <div class="score-board">Pontos: <span class="score"></span></div>

        <!-- TABULEIRO -->
        <div class="grid">
            <label for="c1" class="tile"></label>
            <label for="b1" class="tile"></label>
            <label for="c2" class="tile"></label>

            <label for="c3" class="tile"></label>
            <label for="c4" class="tile"></label>
            <label for="c5" class="tile"></label>

            <label for="b2" class="tile"></label>
            <label for="c6" class="tile"></label>
            <label for="c7" class="tile"></label>
        </div>

        <!-- TELAS DE FIM DE JOGO -->
        <div class="screen screen-lose">
            <h2>💥 BOOM! Fim de jogo</h2>
            <a href="" class="btn-restart">Tentar Novamente</a>
        </div>

        <div class="screen screen-win">
            <h2>⭐ Vitória! Campo limpo!</h2>
            <a href="" class="btn-restart">Jogar de Novo</a>
        </div>
    </div>
</body>
</html>
