<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela da conta jogador</title>
</head>
<body>
    <h1>Registro de Treinador - Pokémon</h1>
    <br>
    <!-- comando de formulario -->
     <form action="/registrar" method="post"></form>
     <div><!-- divisoria do nome-->
        <label for="treiner-name">Nome do Treinador</label>
        <input type="text" id="trainer-name" placeholder="Ex:nome" required>
     </div>
     <br>
      <div><!-- divisoria de email-->
        <label for="treiner-email">Email do Treinador</label>
        <input type="email" id="trainer-email" placeholder="Ex:email" required>
     </div>
     <br>
     <div><!-- divisoria de senha-->
        <label for="treiner-senha">Senha do Treinador</label>
        <input type="password" id="trainer-senha" name="trainer-pin" minlength="4" required>
     </div>
     <br>
     <button type="submit">Registrar</button>


</body>
</html>
